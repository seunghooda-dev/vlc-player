name: CI

on:
  push:
  pull_request:
  # 태그 없이 EXE 빌드를 확인하고 싶을 때 수동 실행한다.
  workflow_dispatch:

# 같은 ref에 연속으로 push하면 이전 실행을 취소한다(태그는 ref가 달라 릴리스 빌드에 영향 없음).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    # 순수 로직 회귀 테스트 — GUI/VLC 불필요, 헤드리스로 안정 실행.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run unit tests
        env:
          MXF_QC_USER_DATA_DIR: ${{ runner.temp }}\mxf_qc_ci
          # 러너 콘솔은 cp1252 — 한국어 테스트 출력/독스트링이 UnicodeEncodeError로 죽지 않게 UTF-8 모드 고정
          PYTHONUTF8: '1'
        run: python -m pytest

  import-gate:
    # check_imports.py 전체 게이트 — PyQt6 필요, 오프스크린 플랫폼으로 헤드리스 실행.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          # 아래 pin 은 requirements.txt 의 부분집합 — 캐시 키를 build-exe 와 공유한다.
          cache-dependency-path: requirements.txt
      - name: Install runtime deps needed for import gate
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6==6.10.2 SQLAlchemy==2.0.46 numpy==2.4.1
      - name: Import consistency + QC logic gate
        env:
          MXF_QC_USER_DATA_DIR: ${{ runner.temp }}\mxf_qc_ci
          QT_QPA_PLATFORM: offscreen
          # check_imports 는 한국어 섹션 헤더를 출력 — cp1252 러너에서 UnicodeEncodeError 방지
          PYTHONUTF8: '1'
        run: python check_imports.py

  build-exe:
    # PyInstaller 스펙 그대로 EXE 빌드 — v* 태그에서만 돌고 GitHub Release 에 첨부한다.
    # 비공개 저장소는 Actions 사용량(Windows 러너 2배)과 아티팩트 용량(무료 500MB) 한도가 있어
    # 일반 push마다 빌드하지 않는다. 태그 없이 확인하려면 workflow_dispatch 로 수동 실행한다.
    # spec은 VLC/FFmpeg를 번들하지 않으므로 러너에 없어도 빌드된다(도구는 실행 대상 PC에서 탐색).
    # bat 체인(build.bat 등)은 VLC 게이트 스모크를 돌리므로 CI에서 재사용하지 않는다.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install runtime deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build EXE from spec
        env:
          PYTHONUTF8: '1'
        run: pyinstaller --noconfirm "MasterQC.spec"
      - name: Sanity smoke on built EXE (VLC 불필요 경로만)
        env:
          MXF_QC_USER_DATA_DIR: ${{ runner.temp }}\mxf_qc_exe
        run: |
          & "dist\MasterQC\MasterQC.exe" --db-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist\MasterQC\MasterQC.exe" --settings-smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip onedir package
        run: Compress-Archive -Path "dist\MasterQC" -DestinationPath "MasterQC-win64.zip"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MasterQC-win64-${{ github.run_number }}-${{ github.sha }}
          path: MasterQC-win64.zip
          # 아티팩트 1건이 약 68MB — 비공개 저장소 무료 용량(500MB)을 잠식하지 않게 짧게 보관한다.
          # 태그 빌드는 같은 zip이 Release 자산으로도 남으므로 이 아티팩트는 임시 확인용이다.
          retention-days: 7
      - name: Attach to GitHub Release (v* 태그)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "MasterQC-win64.zip" --title "MasterQC ${{ github.ref_name }}" --generate-notes
